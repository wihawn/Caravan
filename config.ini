# ---- data ----
daily_dir     = data/daily          # one CSV per symbol: date,open,high,low,close,volume,trades,rv5,rv5_ss,bv5,rsn5,rk,rq5
fundamentals  = data/fundamentals.csv
holdings      = data/portfolio.csv  # symbol,shares,cost_basis
benchmark     = data/benchmark.csv  # date,close  (leave empty to disable)
nav_log       = data/nav_log.csv
out_dir       = out
cash          = 50000

# ---- VolaTTM risk model (Python sidecar) ----
use_model      = true
python         = sidecar/.venv/bin/python
sidecar        = sidecar/volattm_server.py
model_id       = AurelPx/VolaTTM
model_revision = d469ad3aa7a35f973a2476709ebdd802258d4be1

# ---- factor ranking (category weights; normalised) ----
w_value        = 0.25
w_quality      = 0.25
w_growth       = 0.10
w_momentum     = 0.30
w_lowvol       = 0.10
sector_neutral = true   # demean value/quality/growth within sector
ic             = 0.05   # information coefficient: alpha = ic * vol * score

# ---- risk-adjusted optimisation ----
risk_aversion  = 2.0
target_vol     = 0.18   # annualised; 0 disables
max_weight     = 0.15
max_sector     = 0.40
min_invested   = 0.80
max_invested   = 1.00
tc_bps         = 10
holding_days   = 126     # trading costs amortised over the expected holding period
min_trade      = 0.005

# ---- risk / performance ----
corr_lookback  = 252
risk_free      = 0.04

# ---- live ----
live_report_secs = 30
stop_drawdown    = 0.03
